# Gitleaks config — extends the DEFAULT rule set; this file only adds narrow,
# justified allowlist entries. One entry per false positive, each naming why.
#
# DELIBERATELY NO `paths` ENTRY. A `paths` allowlist makes gitleaks skip the whole
# FILE before any rule runs, exempting every secret in it — not just the one you
# meant. Verified, not assumed: an RSA private key planted in wxt.config.ts went
# undetected under a path-scoped allowlist, while the identical key in a neutral
# file was caught. `matchCondition = "AND"` did not change it. Allowlisting the
# literal VALUE keeps the exemption to exactly this one string.
#
# Singular [allowlist], not [[allowlists]]: the array-of-tables form is silently
# ignored by older gitleaks builds, including the one gitleaks-action ships — the
# plural form passed every local scan and still red the PR.
[extend]
useDefault = true

[allowlist]
description = "Chrome extension manifest key — a PUBLIC RSA key, published by design"
# wxt.config.ts carries the `key` field Chrome requires in manifest.json to pin the
# extension ID (chrome.storage is scoped per ID, so a path-derived ID loses the
# rep's session whenever the folder moves). PUBLIC half of the keypair; the private
# half is never in this repo. gitleaks' generic-api-key rule matches it on shape.
regexes = ['''MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAtBZlAz1W5dO40W9VKQbe8''']

name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Law 8 tripwire — no service-role material in the client bundle.
      - run: npm run check:no-service-role
      # Design-token contract — frozen tokens.css must match its recorded hash.
      - run: npm run check:tokens
      # Role wall (SA-03). These are regression guards as much as tests: they
      # fail if a later session gives super_admin a shell, or lets an
      # unrecognised role fall through into one.
      - run: npm test
      # Build enforces the first-load JS budget (<200KB gz) + PWA assets.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci.invalid
          VITE_SUPABASE_ANON_KEY: ci-anon-placeholder

  gitleaks:
    runs-on: ubuntu-latest
    # gitleaks-action calls GET /pulls/{n}/commits on a pull_request event; the
    # repo's default GITHUB_TOKEN permissions don't include that scope (same
    # reason `promote` below has to declare its own `contents: write`).
    # Without this the job 500s on the API call before it ever scans anything —
    # a CI infra failure, not a secret finding.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned by commit SHA, not a floating tag — this is the one job whose entire
      # purpose is to catch what must not land, so it gets the same pin discipline as
      # hub-service and dev-system's copies of this job (same SHA, both pinned for the
      # same reason). v2 -> v3 is a Node 20 -> Node 24 runtime bump only ("no changes to
      # inputs, outputs, or behavior" per the action's own release notes) — verified
      # against this repo's config before landing, not assumed.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  promote:
    needs: [build, gitleaks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward production to main
        run: git push origin HEAD:production
